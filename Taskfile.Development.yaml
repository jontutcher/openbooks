# https://taskfile.dev

version: "3"

tasks:
  init:
    desc: Install Go and Node.JS dependencies.
    cmds:
      - go mod download
      - task: npm-install

  go-update:
    desc: Update Golang dependencies.
    cmds:
      - go get -u ./...
      - go mod tidy

  npm-update:
    desc: Update Node.JS client side dependencies.
    dir: server/app
    cmds:
      - npx npm-check-updates -i
    interactive: true

  npm-install:
    desc: Install Node.JS client side dependencies.
    dir: server/app
    cmds:
      - npm install
    sources:
      - package.json
      - package-lock.json

  irc:
    desc: Start the IRC server the mock bot and OpenBooks connect to.
    cmds:
      - docker run --name ergo -d -p 6667:6667 -p 6697:6697 ghcr.io/ergochat/ergo:stable

  irc-stop:
    desc: Stop and remove the development IRC server.
    cmds:
      - docker rm -f ergo

  mock:
    desc: Start the mock search / download bot. Requires "task dev:irc".
    dir: cmd/mock
    cmds:
      - go run .

  cli:
    desc: Run OpenBooks in CLI Mode.
    dir: cmd/openbooks
    cmds:
      - go build
      - ./openbooks cli --tls=false --server localhost:6667 --name "dev-user"

  server:
    desc: Run OpenBooks in Server Mode.
    dir: cmd/openbooks
    cmds:
      - go build
      - ./openbooks server --tls=false --server localhost:6667 --name "dev-user"

  client:
    desc: Run OpenBooks React Client Application in Development Mode.
    dir: server/app
    cmds:
      - npm run dev

  desktop:
    desc: Run OpenBooks in the experimental desktop mode with a WebView GUI.
    dir: cmd/openbooks
    cmds:
      - go run -tags webview .
